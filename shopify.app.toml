# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "68ec6bfe0fdc97212c695aea2a676746"
application_url = "https://web-production-9de13.up.railway.app"
embedded = true
name = "colissimo-point-relais"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # Webhooks GDPR obligatoires (compliance_topics, mecanisme distinct des
  # souscriptions normales ci-dessus : voir app/routes/webhooks.customers.*
  # et webhooks.shop.redact.jsx). On ne stocke aucune donnee personnelle,
  # ces routes accusent simplement reception.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [ "https://web-production-9de13.up.railway.app/api/auth" ]

[network_access]
# Serveurs contactes en fetch() par l'extension checkout (Checkout.jsx) :
# notre propre backend (recherche de points relais, enregistrement) et
# l'API publique d'adresse du gouvernement francais (autocompletion).
allowed_sources = [
  "https://web-production-9de13.up.railway.app",
  "https://api-adresse.data.gouv.fr",
]

[build]
automatically_update_urls_on_dev = true
